<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bell Schedule Modeler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a teacher's plan book. Two ruled week sheets in the middle, the block
   tray on the left, the running minutes ledger on the right. */
:root {
  --paper: #edf2ef;  --sheet: #ffffff;  --sunk: #f5f8f6;
  --ink: #15302a;    --muted: #54706a;  --rule: #d2dfd9;  --rule-strong: #b3c6be;
  --accent: #0b6e4f; --accent-ink: #ffffff; --accent-soft: #d9efe5;
  --warn: #b3261e;   --warn-soft: #fbe4e1;
  --ok: #17693f;     --ok-soft: #dcf1e3;
  --blk-s: 68%; --blk-l: 86%; --blk-edge-l: 40%; --blk-ink-l: 17%;
  --hatch: #9db3ab;
  --shadow: 0 6px 20px rgba(21, 48, 42, .22);
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1917;  --sheet: #17231f;  --sunk: #13201c;
  --ink: #e3eeea;    --muted: #93aca5;  --rule: #2a3b36;  --rule-strong: #3f5650;
  --accent: #4cc79a; --accent-ink: #06231a; --accent-soft: #173a2e;
  --warn: #ff9d94;   --warn-soft: #472220;
  --ok: #7fdca6;     --ok-soft: #173a29;
  --blk-s: 42%; --blk-l: 27%; --blk-edge-l: 62%; --blk-ink-l: 92%;
  --hatch: #4d645e;
  --shadow: 0 6px 20px rgba(0, 0, 0, .5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0f1917;  --sheet: #17231f;  --sunk: #13201c;
  --ink: #e3eeea;    --muted: #93aca5;  --rule: #2a3b36;  --rule-strong: #3f5650;
  --accent: #4cc79a; --accent-ink: #06231a; --accent-soft: #173a2e;
  --warn: #ff9d94;   --warn-soft: #472220;
  --ok: #7fdca6;     --ok-soft: #173a29;
  --blk-s: 42%; --blk-l: 27%; --blk-edge-l: 62%; --blk-ink-l: 92%;
  --hatch: #4d645e;
  --shadow: 0 6px 20px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 14px/1.4 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 12px; }
.top h1 { font: 700 21px/1.1 var(--f-display); letter-spacing: -.01em; margin-right: 6px; }
.top .spacer { flex: 1 1 auto; }
.grp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.btn {
  border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; font-weight: 500; line-height: 1.3;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--warn); }
.btn.sm { padding: 2px 7px; font-size: 12.5px; }
select.pick, input.txt, select.txt, textarea.txt {
  background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 7px; width: 100%;
}
select.pick { width: auto; max-width: 260px; font-weight: 600; }
.tabs { display: flex; gap: 0; border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; }
.tabs button { border: 0; background: var(--sheet); padding: 5px 12px; cursor: pointer; font-weight: 500; border-left: 1px solid var(--rule); }
.tabs button:first-child { border-left: 0; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* Page frame */
.frame { display: grid; grid-template-columns: 232px minmax(0, 1fr) 336px; gap: 14px; align-items: start; }
.frame.wide { grid-template-columns: minmax(0, 1fr); }
.side { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 11px 12px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.panel h2 { font: 600 11.5px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.panelhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > label, .field > .lab { font-size: 12px; color: var(--muted); font-weight: 500; }
.fieldrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hint { font-size: 12px; color: var(--muted); }
.inline { display: flex; gap: 6px; align-items: center; }
.inline .btn { white-space: nowrap; }
::placeholder { color: var(--muted); opacity: .75; }
.warnline { color: var(--warn); font-weight: 600; }
.btnrow { display: flex; flex-wrap: wrap; gap: 5px; }

/* Block tray */
.tray { display: flex; flex-direction: column; gap: 4px; }
.chip {
  --h: 200;
  display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
  background: hsl(var(--h) var(--blk-s) var(--blk-l)); color: hsl(var(--h) 40% var(--blk-ink-l));
  border: 1px solid hsl(var(--h) 45% var(--blk-edge-l)); border-radius: 5px;
  padding: 4px 7px; cursor: grab; user-select: none; touch-action: pan-y;
}
.chip[data-noncat] { border-style: dashed; }
.chip.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip .nm { flex: 1 1 auto; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .ln { font: 500 12px var(--f-data); }

/* Week sheets */
.sheets { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.week { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; min-width: 0; }
.weekhead { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 8px 12px 6px; }
.weekhead h2 { font: 700 16px/1.2 var(--f-display); }
.weekhead .sum { color: var(--muted); }
.weekhead .sum b { color: var(--ink); font-family: var(--f-data); font-weight: 500; }
.weekhead .btn { margin-left: auto; }
.gridscroll { overflow-x: auto; }
.grid { display: grid; min-width: min-content; user-select: none; -webkit-user-select: none; }
.dayhd {
  border: 0; border-left: 1px solid var(--rule); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule-strong);
  background: var(--sunk); padding: 4px 6px; text-align: left; cursor: pointer; min-width: 0;
}
.dayhd.on { background: var(--accent-soft); }
.dayhd .d { font-weight: 700; display: block; }
.dayhd .m { display: block; font: 400 11.5px var(--f-data); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.corner { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule-strong); }
.axis { position: relative; }
.axis span { position: absolute; right: 5px; transform: translateY(-50%); font: 400 11px var(--f-data); color: var(--muted); }
.axis span:first-child { transform: none; }
.daycol { position: relative; border-left: 1px solid var(--rule); background-repeat: repeat; min-width: 0; }
.daycol.on { background-color: var(--accent-soft); }
.daycol .empty { position: absolute; left: 0; right: 0; top: 10px; text-align: center; font-size: 11.5px; color: var(--muted); pointer-events: none; padding: 0 4px; }

.blk {
  --h: 200;
  position: absolute; left: 3px; right: 3px; overflow: hidden; border-radius: 4px; cursor: grab;
  background: hsl(var(--h) var(--blk-s) var(--blk-l)); color: hsl(var(--h) 40% var(--blk-ink-l));
  border: 1px solid hsl(var(--h) 45% var(--blk-edge-l));
  padding: 1px 5px; font-size: 12px; line-height: 1.2; touch-action: pan-y; z-index: 3;
}
.blk[data-noncat] { border-style: dashed; }
.blk.on { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 4; }
.blk.lift { opacity: .35; }
.blk .nm { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .tm { display: block; font: 400 10.5px var(--f-data); white-space: nowrap; overflow: hidden; }
.blk .mod { font-family: var(--f-data); font-weight: 500; }
.rz { position: absolute; left: 0; right: 0; height: 7px; cursor: ns-resize; touch-action: none; z-index: 2; }
.rz.t { top: -1px; } .rz.b { bottom: -1px; }
.blk:hover .rz.b, .blk.on .rz.b { border-bottom: 3px solid hsl(var(--h) 45% var(--blk-edge-l)); }
.blk:hover .rz.t, .blk.on .rz.t { border-top: 3px solid hsl(var(--h) 45% var(--blk-edge-l)); }
.gap {
  position: absolute; left: 7px; right: 7px; cursor: ns-resize; z-index: 2; touch-action: none;
  background: repeating-linear-gradient(135deg, var(--hatch) 0 1.5px, transparent 1.5px 5px);
  display: flex; align-items: center; justify-content: center;
  font: 400 10px var(--f-data); color: var(--muted);
}
.gap:hover { background-color: var(--accent-soft); }
.gap.mod { background-color: var(--accent-soft); }
.split { position: absolute; left: 2px; right: 2px; border: 1.5px solid var(--rule-strong); border-radius: 5px; background: var(--sunk); display: flex; z-index: 1; }
.split.on { border-color: var(--accent); }
.split.lift { opacity: .35; }
.lane { position: relative; flex: 1 1 0; min-width: 0; border-left: 1px dashed var(--rule-strong); }
.lane:first-of-type { border-left: 0; }
.lane .blk { left: 1px; right: 1px; padding: 1px 3px; }
.lane .gap { left: 3px; right: 3px; }
.splittab {
  position: absolute; top: -1px; right: -1px; z-index: 4; width: 18px; height: 14px; padding: 0; border: 0; border-radius: 0 4px 0 4px;
  background: var(--rule-strong); color: var(--ink); cursor: grab; font: 700 10px/14px var(--f-data); text-align: center;
}
.split.on .splittab { background: var(--accent); color: var(--accent-ink); }
#ghost { position: fixed; z-index: 50; pointer-events: none; left: 0; top: 0; padding: 4px 9px; border-radius: 5px; font-weight: 600; font-size: 12.5px; box-shadow: var(--shadow); background: var(--sheet); border: 1.5px solid var(--accent); white-space: nowrap; }
#ghost small { display: block; font: 400 11px var(--f-data); color: var(--muted); }
#dropline { position: fixed; z-index: 49; pointer-events: none; height: 3px; background: var(--accent); border-radius: 2px; }
body.dragging, body.dragging * { cursor: grabbing !important; }
body.sizing, body.sizing * { cursor: ns-resize !important; }

/* Ledger */
.stats { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 6px; }
.stat { background: var(--sunk); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.stat .k { font-size: 11.5px; color: var(--muted); display: block; }
.stat .v { font: 700 21px/1.15 var(--f-display); font-variant-numeric: tabular-nums; display: block; white-space: nowrap; }
.stat .v.rng { white-space: normal; }
.stat.main { background: var(--accent-soft); }
.pill { display: inline-block; border-radius: 99px; padding: 1px 7px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill.short { background: var(--warn-soft); color: var(--warn); }
.pill.met { background: var(--ok-soft); color: var(--ok); }
.ledger { width: 100%; border-collapse: collapse; }
.ledger th, .ledger td { padding: 3px 0 3px 8px; text-align: right; font-size: 12.5px; }
.ledger th:first-child, .ledger td:first-child { text-align: left; padding-left: 0; overflow-wrap: anywhere; }
.ledger thead th { font-size: 11.5px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--rule-strong); }
.ledger tr.cat td { font-size: 11.5px; font-weight: 600; color: var(--muted); padding-top: 8px; text-transform: uppercase; letter-spacing: .05em; }
.ledger tr.line td { border-bottom: 1px solid var(--rule); }
.ledger tr.sub td { font-weight: 700; }
.ledger td.n { font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { --h: 200; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: hsl(var(--h) 55% 50%); }
.meter { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; margin-top: 2px; }
.meter i { display: block; height: 100%; background: var(--ok); }
.meter.short i { background: var(--warn); }
.lanemark { color: var(--muted); font-size: 11px; cursor: help; }
.tgt { display: flex; justify-content: space-between; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); padding-top: 1px; }

/* Length table and compare */
.tablewrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; }
.lt { border-collapse: separate; border-spacing: 0; width: 100%; }
.lt th, .lt td { padding: 4px 5px; border-bottom: 1px solid var(--rule); text-align: center; font-size: 12.5px; white-space: nowrap; }
.lt thead th { background: var(--sunk); font-weight: 600; }
.lt .wkstart { border-left: 2px solid var(--rule-strong); }
.lt .stick { position: sticky; left: 0; background: var(--sheet); text-align: left; z-index: 1; font-weight: 600; }
.lt thead .stick { background: var(--sunk); }
.lt input { width: 46px; text-align: center; padding: 3px 2px; border: 1px solid transparent; border-radius: 4px; background: transparent; font-family: var(--f-data); font-size: 12.5px; }
.lt input:hover, .lt input:focus { border-color: var(--rule-strong); background: var(--sheet); }
.lt input.diff { background: var(--accent-soft); font-weight: 500; }
.lt .fixed { font-family: var(--f-data); color: var(--muted); }
.note { color: var(--muted); padding: 10px 2px; max-width: 70ch; }
.cmp { display: flex; flex-direction: column; gap: 12px; }
.pickrow { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.pickrow label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.minis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.mini { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 11px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mini h3 { font: 700 14px/1.2 var(--f-display); }
.strip { position: relative; height: 130px; display: grid; grid-template-columns: repeat(7, 1fr) 8px repeat(7, 1fr); gap: 2px; }
.strip .col { position: relative; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.strip .col i { position: absolute; --h: 200; background: hsl(var(--h) 55% 55%); border-radius: 1px; }
.striplabs { display: grid; grid-template-columns: repeat(7, 1fr) 8px repeat(7, 1fr); gap: 2px; font: 400 9.5px var(--f-data); color: var(--muted); text-align: center; }
.delta { font-size: 11.5px; display: block; color: var(--muted); }
.delta.up { color: var(--ok); } .delta.down { color: var(--warn); }

/* Dialog and toast */
dialog { border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--sheet); color: var(--ink); padding: 16px; width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 25, 20, .45); }
dialog form, .dlg { display: flex; flex-direction: column; gap: 10px; }
dialog h2 { font: 700 18px/1.2 var(--f-display); }
dialog textarea { min-height: 200px; font: 12px/1.4 var(--f-data); resize: vertical; }
.dlgbtns { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 6px; }
.err { color: var(--warn); font-size: 12.5px; }
#toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 7px 14px; border-radius: 7px; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

@media (max-width: 1180px) {
  .frame { grid-template-columns: 210px minmax(0, 1fr); }
  /* The right panels sit under the calendar in the second column only. The block list stays pinned in the
     first column as you scroll, so it must have that column to itself or it covers the panels. */
  .right { grid-column: 2; position: static; max-height: none; flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
  .right > .panel { flex: 1 1 320px; }
}
@media (max-width: 760px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; }
  .right { order: -1; grid-column: 1; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .tabs button { transition: border-color .12s, background-color .12s; } }
@media print {
  body { background: #fff; padding: 0; }
  .top .grp, .top .tabs, .top .spacer, .left, .insp, .weekhead .btn, #toast { display: none !important; }
  .frame { display: block; }
  .side { position: static; max-height: none; }
  .week { break-inside: avoid; border: 0; }
  .gridscroll { overflow: visible; }
  .blk, .chip, .dot, .meter i { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Bell Schedule Modeler</h1>
  <div class="grp">
    <select id="modelPick" class="pick" aria-label="Schedule model"></select>
    <button class="btn" data-act="newModel">New</button>
    <button class="btn" data-act="dupModel">Duplicate</button>
    <button class="btn danger" data-act="delModel">Delete</button>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-act="view" data-v="schedule">Schedule</button>
    <button role="tab" data-act="view" data-v="lengths">Length table</button>
    <button role="tab" data-act="view" data-v="compare">Compare</button>
  </div>
  <div class="spacer"></div>
  <div class="grp">
    <button class="btn" data-act="undo" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" data-act="redo" id="redoBtn" title="Redo (Ctrl+Y)">Redo</button>
    <button class="btn" data-act="exportDlg">Export</button>
    <button class="btn" data-act="importDlg">Import</button>
    <button class="btn" data-act="print" id="printBtn" hidden>Print</button>
  </div>
</header>
<main class="frame" id="frame">
  <aside class="side left" id="left"></aside>
  <section class="sheets" id="center"></section>
  <aside class="side right" id="right"></aside>
</main>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="ghost" hidden></div>
<div id="dropline" hidden></div>

<script>
'use strict';
/* ---------- Constants ---------- */
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const CATS = { class: 'Class', advisory: 'Advisory', lunch: 'Lunch', break: 'Break', other: 'Other' };
const HUES = [212, 158, 32, 340, 268, 186, 95, 12, 240, 52, 300, 130];
const SNAP = 5, MIN_LEN = 5, MAX_LANES = 4;
/* Allowed ranges, in minutes. Every way a number gets in (typing, dragging, import, saved data)
   goes through these, so no value can make the calendar too large to draw. */
const LIM = { len: [MIN_LEN, 600], pass: [0, 60], gap: [0, 480], start: [0, 1439] };
/* Import limits, far above any real schedule, so a crafted file can't stall the page. */
const MAX = { models: 100, blocks: 100, items: 60, laneItems: 30 };
const ZOOMS = { Compact: 0.85, Normal: 1.15, Large: 1.6 };
const IS_LOCAL = /^(file:|https?:\/\/(localhost|127\.0\.0\.1|\[::1\]))/.test(location.href);

/* ---------- Storage: the one place that reads and writes saved models.
   Replace these two functions to move from browser storage to a shared library. ---------- */
const store = {
  key: 'bell-schedule-modeler.v1',
  load() { try { return JSON.parse(localStorage.getItem(this.key)); } catch (e) { return null; } },
  save(data) { try { localStorage.setItem(this.key, JSON.stringify(data)); return true; } catch (e) { return false; } },
  // Calls fn with the saved data whenever another tab or window of this app saves.
  watch(fn) {
    window.addEventListener('storage', e => {
      if (e.key !== this.key || e.newValue == null) return;
      let data; try { data = JSON.parse(e.newValue); } catch (err) { return; }
      fn(data);
    });
  },
};

/* ---------- Small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => 'x' + Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const snap = v => Math.round(v / SNAP) * SNAP;
const clone = o => JSON.parse(JSON.stringify(o));
const dayName = d => `${DAYS[d % 7]} W${d < 7 ? 1 : 2}`;

  const el = e.target.closest?.('[data-item],[data-pal]');
  if (el && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    S.sel = el.dataset.item ? { kind: 'item', id: el.dataset.item } : { kind: 'block', id: el.dataset.pal };
    render(); return;
  }
  if (S.sel?.kind !== 'item' || !findItem(M(), S.sel.id)) return;
  const id = S.sel.id;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); actions.delItem(); return; }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const dir = e.key === 'ArrowUp' ? -1 : 1;
    if (e.shiftKey) commit(m => { const f = findItem(m, id); if (f.it.t === 'b') setDur(m, f.it, clamp(durOf(m, f.it) + dir * SNAP, ...LIM.len)); });
    else actions.moveItem({ dataset: { dir } });
    document.querySelector(`[data-item="${id}"]`)?.focus();
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    commit(m => {
      const f = findItem(m, id); if (!f.top) return;
      const t = f.d + (e.key === 'ArrowLeft' ? -1 : 1); if (t < 0 || t > 13) return;
      f.seq.splice(f.idx, 1); f.it.gap = null;
      const dest = m.days[t].items; dest.splice(Math.min(f.idx, dest.length), 0, f.it);
    });
    document.querySelector(`[data-item="${id}"]`)?.focus();
  }
});

/* ---------- Dialogs ---------- */
const dlg = $('#dlg');
function openDlg(html, wire) { dlg.oncancel = null; dlg.innerHTML = html; wire(dlg); if (!dlg.open) dlg.showModal(); }
function confirmDlg(title, msg, ok, onOk, onCancel) {
  openDlg(`<div class="dlg"><h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="dlgbtns"><button class="btn" id="dNo">Cancel</button><button class="btn primary" id="dYes">${esc(ok)}</button></div></div>`, d => {
    $('#dNo', d).onclick = () => { dlg.close(); onCancel?.(); };
    $('#dYes', d).onclick = () => { dlg.close(); onOk(); };
    // Escape closes the dialog without a click, and must count as Cancel too.
    dlg.oncancel = () => { dlg.oncancel = null; onCancel?.(); };
  });
}
function newModelDlg() {
  openDlg(`<form method="dialog" id="nf"><h2>New schedule model</h2>
    <div class="field"><label for="nName">Model name</label><input class="txt" id="nName" maxlength="80" placeholder="New schedule model" autocomplete="off"></div>
    <div class="fieldrow">
      <div class="field"><label for="nCount">Number of blocks</label><input class="txt num" id="nCount" type="number" min="1" max="40" value="6" required></div>
      <div class="field"><label for="nStyle">Name blocks</label><select class="txt" id="nStyle"><option value="block">Block A, Block B…</option><option value="period">Period 1, Period 2…</option></select></div>
    </div>
    <div class="fieldrow">
      <div class="field"><label for="nLen">Default length (min)</label><input class="txt num" id="nLen" type="number" min="5" max="${LIM.len[1]}" value="50" required></div>
      <div class="field"><label for="nPass">Passing (min)</label><input class="txt num" id="nPass" type="number" min="0" max="${LIM.pass[1]}" value="5" required></div>
    </div>
    <div class="fieldrow">
      <div class="field"><label for="nStart">Day starts</label><input class="txt num" id="nStart" type="time" step="300" value="08:00" required></div>
      <div class="field"><label for="nLunch">Include a Lunch block</label><select class="txt" id="nLunch"><option value="30">Yes, 30 min</option><option value="">No</option></select></div>
    </div>
    <label><input type="checkbox" id="nFill" checked> Start with every block on Monday to Friday, both weeks</label>
    <div class="dlgbtns"><button type="button" class="btn" id="nNo">Cancel</button><button type="submit" class="btn primary">Create model</button></div></form>`, d => {
    $('#nNo', d).onclick = () => dlg.close();
    $('#nf', d).onsubmit = e => {
      e.preventDefault();
      const n = clamp(posInt($('#nCount', d).value, 6), 1, 40), len = fit($('#nLen', d).value, LIM.len, 50);
      const style = $('#nStyle', d).value, start = parseTime($('#nStart', d).value) ?? 480, lunch = posInt($('#nLunch', d).value);
      const name = i => style === 'period' ? `Period ${i + 1}` : `Block ${i < 26 ? String.fromCharCode(65 + i) : i + 1}`;
      const blocks = Array.from({ length: n }, (_, i) => mkBlock(name(i), 'class', len, HUES[i % HUES.length]));
      const m = mkModel(uniqueName($('#nName', d).value.trim() || 'New schedule model', modelNames()), blocks, { passing: fit($('#nPass', d).value, LIM.pass, 5), start, len });
      let lb = null;
      if (lunch) { lb = mkBlock('Lunch', 'lunch', lunch, HUES[9]); m.blocks.push(lb); }
      if ($('#nFill', d).checked) [1, 2, 3, 4, 5, 8, 9, 10, 11, 12].forEach(i => {
        const seq = blocks.map(b => mkItem(b.id));
        if (lb) seq.splice(Math.ceil(n / 2), 0, mkItem(lb.id));
        m.days[i].items = seq;
      });
      S.models.push(m); S.activeId = m.id; S.sel = null; S.view = 'schedule';
      dlg.close(); persist(); render();
    };
  });
}
/* Spreadsheet apps run a cell that starts with = + - @ (or a tab or return) as a formula, and block names can come
   from an imported file. Such text gets a leading apostrophe so it stays text. Numbers are left alone. */
const csvCell = v => {
  let s = String(v);
  if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = `'${s}`;
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};
const csv = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');
const plainR = r => !r ? 0 : r.lo === r.hi ? r.lo : `${r.lo}-${r.hi}`;
function scheduleCSV(m) {
  const rows = [['Week', 'Day', 'Lane', 'Start', 'End', 'Block', 'Type', 'Minutes', 'Passing before']];
  const add = (d, lane, x, extra = 0) => { const b = blockOf(m, x.it.blockId); rows.push([d < 7 ? 1 : 2, DAYS[d % 7], lane, hhmm(x.start), hhmm(x.end), b.name, CATS[b.cat], x.end - x.start, x.gap + extra]); };
  m.days.forEach((day, d) => layoutSeq(m, day.items, day.start, true).forEach(x => {
    if (x.it.t === 'b') add(d, '', x);
    else x.it.lanes.forEach((l, li) => layoutSeq(m, l, x.start, false).forEach((y, yi) => add(d, li + 1, y, yi === 0 ? x.gap : 0)));
  }));
  return csv(rows);
}
function totalsCSV(m) {
  const t = totals(m), rows = [['Item', 'Type', 'Week 1 min', 'Week 2 min', 'Two-week min', 'Two-week target', 'Status']];
  const st = s => !s ? '' : s.met ? 'Met' : `${s.short} short`;
  rows.push(['All class time', 'Class', plainR(t.w[0].cats.class), plainR(t.w[1].cats.class), plainR(t.all.cats.class), m.classTarget ?? '', st(targetState(m.classTarget, t.all.cats.class))]);
  m.blocks.forEach(b => rows.push([b.name, CATS[b.cat], plainR(t.w[0].blocks[b.id]), plainR(t.w[1].blocks[b.id]), plainR(t.all.blocks[b.id]), b.target ?? '', st(targetState(b.target, t.all.blocks[b.id]))]));
  rows.push(['Passing', 'Passing', plainR(t.w[0].pass), plainR(t.w[1].pass), plainR(t.all.pass), '', '']);
  return csv(rows);
}
function exportDlg() {
  const m = M();
  const kinds = {
    model: { label: 'This model, to re-import (.json)', ext: 'json', text: () => JSON.stringify({ app: 'bell-schedule-modeler', version: 1, models: [m] }, null, 1) },
    all: { label: 'All models, to re-import (.json)', ext: 'json', text: () => JSON.stringify({ app: 'bell-schedule-modeler', version: 1, models: S.models }, null, 1) },
    bell: { label: 'Bell schedule (.csv)', ext: 'csv', text: () => scheduleCSV(m) },
    totals: { label: 'Totals by block (.csv)', ext: 'csv', text: () => totalsCSV(m) },
  };
  openDlg(`<div class="dlg"><h2>Export</h2>
    <div class="field"><label for="xKind">What to export</label><select class="txt" id="xKind">${Object.entries(kinds).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('')}</select></div>
    <textarea class="txt" id="xText" readonly aria-label="Exported text"></textarea>
    <div class="dlgbtns"><button class="btn" id="xClose">Close</button><button class="btn" id="xCopy">Copy</button>${IS_LOCAL ? '<button class="btn primary" id="xSave">Download</button>' : ''}</div></div>`, d => {
    const area = $('#xText', d), kind = $('#xKind', d), fill = () => { area.value = kinds[kind.value].text(); };
    kind.onchange = fill; fill();
    $('#xClose', d).onclick = () => dlg.close();
    $('#xCopy', d).onclick = () => {
      const fallback = () => { area.select(); toast('Press Ctrl+C to copy the selected text.'); };
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(area.value).then(() => toast('Copied'), fallback); else fallback();
    };
    const save = $('#xSave', d);
    if (save) save.onclick = () => {
      const k = kinds[kind.value], a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([area.value], { type: k.ext === 'csv' ? 'text/csv' : 'application/json' }));
      a.download = `${m.name.replace(/[^\w-]+/g, '-').toLowerCase()}-${kind.value}.${k.ext}`;
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
  });
}
function applyLenDlg() {
  const m = M();
  openDlg(`<form id="af"><h2>Set every block to one length</h2>
    <div class="field"><label for="aLen">Length (min)</label><input class="txt num" id="aLen" type="number" min="5" max="${LIM.len[1]}" step="5" value="${m.blockLen}"></div>
    <label><input type="checkbox" id="aAll"> Also change Lunch, Advisory, Break and Other blocks</label>
    <p id="aWarn"></p>
    <p class="err" id="aErr" hidden></p>
    <div class="dlgbtns"><button type="button" class="btn" id="aNo">Cancel</button><button type="submit" class="btn primary" id="aGo">Apply</button></div></form>`, d => {
    const targets = () => m.blocks.filter(b => $('#aAll', d).checked || b.cat === 'class');
    const update = () => {
      const ts = targets(), n = posInt($('#aLen', d).value);
      const custom = ts.reduce((a, b) => a + placements(m, b.id).filter(p => p.it.dur != null && p.it.dur !== n).length, 0);
      $('#aGo', d).disabled = !ts.length;
      $('#aWarn', d).innerHTML = !ts.length ? 'This model has no Class blocks. Tick the box above to change the other blocks.'
        : `This sets ${ts.length} block${ts.length > 1 ? 's' : ''} to ${n ?? '?'} minutes on every day and makes ${n ?? '?'} the default for new blocks.<br>`
        + (custom ? `<span class="warnline">It erases ${custom} day-specific length${custom > 1 ? 's' : ''} you set by hand.</span> ` : 'No day-specific lengths are set, so nothing else changes. ')
        + 'Passing times are kept. Undo can reverse this.';
    };
    $('#aLen', d).oninput = update; $('#aAll', d).onchange = update; update();
    $('#aNo', d).onclick = () => dlg.close();
    $('#af', d).onsubmit = e => {
      e.preventDefault();
      const n = within($('#aLen', d).value, LIM.len);
      if (n == null) { const err = $('#aErr', d); err.hidden = false; err.textContent = `Enter a length from ${LIM.len[0]} to ${LIM.len[1]} minutes.`; return; }
      const ids = targets().map(b => b.id);
      dlg.close();
      commit(mm => {
        mm.blockLen = n;
        ids.forEach(id => { blockOf(mm, id).len = n; placements(mm, id).forEach(p => { p.it.dur = null; }); });
      });
      toast(`Set ${ids.length} block${ids.length > 1 ? 's' : ''} to ${n} minutes`);
    };
  });
}
/* Builds a clean model from data the app didn't just make: an imported file, or what was saved in
   this browser. Nothing from the input is kept unless it is checked. Imports always get new ids;
   saved models keep plain, unique ids so the chosen model and Compare picks survive a reload. */
function cleanModel(raw, fromStorage = false) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.blocks) || !Array.isArray(raw.days) || raw.days.length !== 14) throw new Error('A model needs a block list and exactly 14 days.');
  const limit = (n, max, what) => { if (!fromStorage && n > max) throw new Error(`A model can have at most ${max} ${what}.`); };
  limit(raw.blocks.length, MAX.blocks, 'blocks');
  const used = new Set();
  const newId = v => { const id = fromStorage && safeId(v) && !used.has(v) ? v : uid(); used.add(id); return id; };
  const list = v => Array.isArray(v) ? v : [];
  const idMap = new Map(); // block id in the input -> block id in the app. A repeated id maps to its first block only.
  const blocks = raw.blocks.map((b, i) => {
    b = b && typeof b === 'object' ? b : {};
    const id = newId(b.id);
    if (b.id != null && !idMap.has(String(b.id))) idMap.set(String(b.id), id);
    return {
      id, name: String(b.name || `Block ${i + 1}`).slice(0, 60), cat: has(CATS, b.cat) ? b.cat : 'other',
      len: fit(b.len, LIM.len, 50), hue: HUES.includes(b.hue) ? b.hue : HUES[i % HUES.length], target: b.target == null ? null : posInt(b.target),
    };
  });
  const opt = (v, lim) => v == null ? null : fit(v, lim, lim[0]);
  const item = (it, inLane) => {
    if (!it || typeof it !== 'object') return null;
    if (it.t === 's' && !inLane && Array.isArray(it.lanes)) {
      const lanes = it.lanes.slice(0, MAX_LANES).map(l => { limit(list(l).length, MAX.laneItems, 'blocks in one lane'); return list(l).map(x => item(x, true)).filter(Boolean); });
      // A split with nothing in it would only add a passing period, so it is dropped.
      return lanes.some(l => l.length) ? { id: newId(it.id), t: 's', gap: opt(it.gap, LIM.gap), lanes } : null;
    }
    if (it.t === 'b' && idMap.has(String(it.blockId))) return { id: newId(it.id), t: 'b', blockId: idMap.get(String(it.blockId)), dur: opt(it.dur, LIM.len), gap: opt(it.gap, LIM.gap) };
    return null;
  };
  return {
    id: fromStorage && safeId(raw.id) ? raw.id : uid(), name: String(raw.name || 'Imported model').slice(0, 80),
    passing: fit(raw.passing, LIM.pass, 5), defaultStart: fit(raw.defaultStart, LIM.start, 480),
    blockLen: within(raw.blockLen, LIM.len), classTarget: raw.classTarget == null ? null : posInt(raw.classTarget), blocks,
    days: raw.days.map(d => {
      limit(list(d?.items).length, MAX.items, 'blocks in one day');
      return { start: fit(d?.start, LIM.start, 480), items: list(d?.items).map(x => item(x, false)).filter(Boolean) };
    }),
  };
}
// Saved models go through the same checks as imports, so a bad value saved by an older version is repaired on load.
function loadModels(list) {
  const out = [], ids = new Set();
  let skipped = 0;
  (Array.isArray(list) ? list : []).forEach(raw => {
    try { const m = cleanModel(raw, true); if (ids.has(m.id)) m.id = uid(); ids.add(m.id); out.push(m); } catch (e) { skipped++; }
  });
  return { models: out, skipped };
}
function importDlg() {
  openDlg(`<div class="dlg"><h2>Import models</h2>
    <p class="hint">Choose a .json file made with Export, or paste its text. Imported models are added to your list.</p>
    <div class="field"><label for="iFile">File</label><input type="file" id="iFile" accept=".json,application/json"></div>
    <textarea class="txt" id="iText" aria-label="Paste exported text" placeholder="Or paste exported text here"></textarea>
    <p class="err" id="iErr" hidden></p>
    <div class="dlgbtns"><button class="btn" id="iNo">Cancel</button><button class="btn primary" id="iGo">Import</button></div></div>`, d => {
    $('#iNo', d).onclick = () => dlg.close();
    $('#iFile', d).onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#iText', d).value = r.result; }; r.readAsText(f); };
    $('#iGo', d).onclick = () => {
      const err = $('#iErr', d);
      try {
        const data = JSON.parse($('#iText', d).value);
        const list = Array.isArray(data?.models) ? data.models : Array.isArray(data) ? data : [data];
        if (list.length > MAX.models) throw new Error(`A file can hold at most ${MAX.models} models.`);
        const got = list.map(raw => cleanModel(raw));
        if (!got.length) throw new Error('The file has no models in it.');
        got.forEach(m => { normalizeModel(m, modelNames()); S.models.push(m); });
        S.activeId = got[0].id; S.sel = null;
        // Draw before saving, so a model that can't be drawn is never saved.
        dlg.close(); render(); persist(); toast(`Imported ${got.length} model${got.length > 1 ? 's' : ''}`);
      } catch (ex) {
        err.hidden = false;
        err.textContent = ex instanceof SyntaxError ? 'That text is not a valid export. Copy the whole export and try again.' : ex.message;
      }
    };
  });
}

$('#tabs').addEventListener('keydown', e => e.stopPropagation());
render();
// If a saved model couldn't be read, leave the saved copy alone until the next edit.
if (loaded.skipped) toast(`${loaded.skipped} saved model${loaded.skipped > 1 ? 's' : ''} couldn't be read and ${loaded.skipped > 1 ? 'were' : 'was'} left out.`);
else persist();
</script>
